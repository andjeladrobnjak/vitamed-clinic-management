<p class="doctor-rating" [class.is-empty]="!hasRating" [attr.aria-label]="accessibleLabel">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    @for (node of starIcon; track $index) {
      @if (node[0] === 'path') {
        <path [attr.d]="$any(node[1]).d"></path>
      } @else if (node[0] === 'polygon') {
        <polygon [attr.points]="$any(node[1]).points"></polygon>
      }
    }
  </svg>
  @if (hasRating) {
    <span>{{ ratingLabel }}</span>
    @if (showCount()) {
      <span class="rating-separator" aria-hidden="true">·</span>
      <span>{{ countLabel }}</span>
    }
  } @else {
    <span>Još nema ocena</span>
  }
</p>
