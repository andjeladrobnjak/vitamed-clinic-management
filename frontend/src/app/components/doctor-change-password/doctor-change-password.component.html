<div class="doctor-login-page">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="change-password-heading">
      <a class="logo" routerLink="/" aria-label="VitaMed, privatna klinika">
        <span class="logo-mark">
          <span class="logo-vita">Vita</span><span class="logo-med">Med</span>
        </span>
        <span class="logo-tagline"><span>Privatna</span><span>Klinika</span></span>
      </a>

      <p class="eyebrow">Portal za lekare</p>
      <h1 id="change-password-heading">Postavite novu lozinku</h1>
      <p class="lead">Pre nego što nastavite, potrebno je da promenite privremenu lozinku.</p>

      <form [formGroup]="form" class="fields" (ngSubmit)="onSubmit()">
        <label class="field">
          <span>Nova lozinka</span>
          <span class="password-wrap">
            <input
              [type]="passwordVisible ? 'text' : 'password'"
              formControlName="password"
              autocomplete="new-password"
              placeholder="Unesite novu lozinku"
              [class.field-invalid]="form.get('password')?.touched && form.get('password')?.invalid"
            >
            <button
              class="password-toggle"
              type="button"
              (click)="togglePassword()"
              [attr.aria-label]="passwordVisible ? 'Sakrij lozinku' : 'Prikaži lozinku'"
              [attr.aria-pressed]="passwordVisible"
            >
              @if (passwordVisible) {
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"></path>
                  <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path>
                  <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 2.747-3.941"></path>
                  <path d="m2 2 20 20"></path>
                </svg>
              } @else {
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              }
            </button>
          </span>
          @if (form.get('password')?.touched && form.get('password')?.invalid) {
            @if (form.get('password')?.errors?.['required']) {
              <p class="error-message">Nova lozinka je obavezna.</p>
            }
            @if (form.get('password')?.errors?.['policy']) {
              <p class="error-message">Nova lozinka ne ispunjava bezbednosne zahteve.</p>
            }
          }
        </label>

        <label class="field">
          <span>Potvrdite novu lozinku</span>
          <span class="password-wrap">
            <input
              [type]="confirmVisible ? 'text' : 'password'"
              formControlName="confirmPassword"
              autocomplete="new-password"
              placeholder="Ponovite novu lozinku"
              [class.field-invalid]="form.get('confirmPassword')?.touched && (form.get('confirmPassword')?.invalid || form.hasError('passwordMismatch'))"
            >
            <button
              class="password-toggle"
              type="button"
              (click)="toggleConfirm()"
              [attr.aria-label]="confirmVisible ? 'Sakrij lozinku' : 'Prikaži lozinku'"
              [attr.aria-pressed]="confirmVisible"
            >
              @if (confirmVisible) {
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"></path>
                  <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path>
                  <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 2.747-3.941"></path>
                  <path d="m2 2 20 20"></path>
                </svg>
              } @else {
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              }
            </button>
          </span>
          @if (form.get('confirmPassword')?.touched && form.hasError('passwordMismatch')) {
            <p class="error-message">Lozinke se ne podudaraju.</p>
          }
        </label>

        @if (serverError) {
          <p class="form-feedback form-feedback-error" role="alert">{{ serverError }}</p>
        }

        <button class="btn btn-primary" type="submit" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Čuvanje...' : 'Postavi novu lozinku' }}
        </button>
      </form>

      <div class="card-footer">
        <button class="back-link" type="button" (click)="logout()">Odjavite se</button>
      </div>
    </section>
  </main>
</div>
