<div class="doctor-login-page">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="doctor-login-heading">
      <a class="logo" routerLink="/" aria-label="VitaMed, privatna klinika">
        <span class="logo-mark">
          <span class="logo-vita">Vita</span><span class="logo-med">Med</span>
        </span>
        <span class="logo-tagline"><span>Privatna</span><span>Klinika</span></span>
      </a>

      <p class="eyebrow">Portal za lekare</p>
      <h1 id="doctor-login-heading">Prijavite se na svoj nalog</h1>
      <p class="lead">Pristupite svom VitaMed portalu.</p>

      <form [formGroup]="loginForm" class="fields" autocomplete="on" (ngSubmit)="onSubmit()">
        <label class="field">
          <span>Email adresa</span>
          <input
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="ime.prezime@email.com"
            [class.field-invalid]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
          >
          @if (loginForm.get('email')?.touched && loginForm.get('email')?.invalid) {
            @if (loginForm.get('email')?.errors?.['required']) {
              <p class="error-message">Email adresa je obavezna.</p>
            }
            @if (loginForm.get('email')?.errors?.['email']) {
              <p class="error-message">Unesite ispravnu email adresu.</p>
            }
          }
        </label>

        <label class="field">
          <span>Lozinka</span>
          <span class="password-wrap">
            <input
              [type]="passwordVisible ? 'text' : 'password'"
              formControlName="password"
              autocomplete="current-password"
              placeholder="Unesite lozinku"
              [class.field-invalid]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
            >
            <button
              class="password-toggle"
              type="button"
              (click)="togglePassword()"
              [attr.aria-label]="passwordVisible ? 'Sakrij lozinku' : 'Prikaži lozinku'"
              [attr.aria-pressed]="passwordVisible"
            >
              @if (passwordVisible) {
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"></path>
                  <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path>
                  <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 2.747-3.941"></path>
                  <path d="m2 2 20 20"></path>
                </svg>
              } @else {
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              }
            </button>
          </span>
          @if (loginForm.get('password')?.touched && loginForm.get('password')?.invalid) {
            @if (loginForm.get('password')?.errors?.['required']) {
              <p class="error-message">Lozinka je obavezna.</p>
            }
          }
        </label>

        @if (serverError) {
          <p class="form-feedback form-feedback-error" role="alert">{{ serverError }}</p>
        }

        <button class="btn btn-primary" type="submit" [disabled]="isSubmitting">
          @if (isSubmitting) {
            Prijavljivanje...
          } @else {
            Prijavite se
          }
        </button>
      </form>

      <div class="card-footer">
        <a class="back-link" routerLink="/">← Nazad na VitaMed</a>
      </div>
    </section>
  </main>
</div>
